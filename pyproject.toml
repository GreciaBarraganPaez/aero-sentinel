[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-sentinel"
version = "0.1.0"
description = "NASA C-MAPSS data validation and exploratory analysis"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<3.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
